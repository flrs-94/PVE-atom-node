# QAT Acceleration Engine 0 - Host Critical Services
# Performance-optimierte Konfiguration für Proxmox Host

[AE0_HOST]
VF_ASSIGNMENT="0,1,2"
ENGINE_TYPE="Mixed"
PRIORITY="CRITICAL"
WORKLOAD="System,LUKS,SSH,TLS,ZFS"

# VF 0: System Critical (LUKS, SSH)
[VF0_SYSTEM]
PURPOSE="System Encryption"
WORKLOAD="LUKS,SSH,System-TLS"
CRYPTO_ALGO="AES-256-XTS,AES-256-GCM"
TARGET_THROUGHPUT="2Gbps"

# VF 1: ZFS Acceleration (ohne native QAT)
[VF1_ZFS]
PURPOSE="Storage Acceleration"
WORKLOAD="File-IO,Backup-Encryption"
CRYPTO_ALGO="AES-256-CTR,SHA-256"
TARGET_THROUGHPUT="4Gbps"

# VF 2: Management Services
[VF2_MGMT]
PURPOSE="Management Interface"
WORKLOAD="Proxmox-WebUI,SSH,Monitoring"
CRYPTO_ALGO="TLS-1.3,RSA-2048"
TARGET_THROUGHPUT="1Gbps"

# Performance Thresholds
[MONITORING]
WARNING_THRESHOLD="80"
CRITICAL_THRESHOLD="95"
LOAD_BALANCE="true"

# Host Priority Settings
[PRIORITY]
SYSTEM_CRITICAL="VF0"
PERFORMANCE_CRITICAL="VF1"
MANAGEMENT="VF2"