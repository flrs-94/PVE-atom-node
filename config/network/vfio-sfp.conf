# VFIO-Konfiguration für SFP+ Passthrough
# Intel X553 10GbE SFP+ Controller
# Vendor ID: 8086, Device ID: 15c4

# Hardware Limitation: 0b:00.0/0b:00.1 require valid SFP+ modules to initialize
# Only 0c:00.0 (sfp8) and 0c:00.1 (sfp9) work without transceivers inserted
# Error: "failed to load because an unsupported SFP+ or QSFP module type was detected"

# NUR sfp9 (0c:00.1) für pfSense Passthrough reservieren
# sfp8 (0c:00.0) bleibt am Host verfügbar mit ixgbe Treiber

# Keine generelle ixgbe Blacklist - nur spezifische Geräte über vfio-pci.conf
softdep ixgbe pre: vfio-pci