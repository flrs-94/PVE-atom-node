# Netzwerk-Konfiguration für Gateway mit pfSense + TrueNAS
# /etc/network/interfaces Erweiterung

# Management Bridge (existiert bereits)
# auto vmbr0
# iface vmbr0 inet static
#     address 192.168.1.100/24
#     gateway 192.168.1.1
#     bridge-ports enp8s0
#     bridge-stp off
#     bridge-fd 0

# TrueNAS Bridge (neue Konfiguration)
auto vmbr1
iface vmbr1 inet manual
    bridge-ports eno1
    bridge-stp off
    bridge-fd 0
    bridge-vlan-aware yes
    # Optional: eno2 als Backup hinzufügen
    # bridge-ports eno1 eno2

# VLAN-fähige Bridge für mehrere Services
auto vmbr2  
iface vmbr2 inet manual
    bridge-ports eno2
    bridge-stp off
    bridge-fd 0
    bridge-vlan-aware yes